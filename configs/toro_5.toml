# Toro 5: Colliding shocks. Начальные состояния постоянны на полуосях.
config_version = 2

[problem]
type = "euler_1d"

[parameters]
gamma = 1.4

[domain]
x = [0.0, 1.0]
t = [0.0, 0.035]

[grid]
cells = 200

[initials]
type = "riemann"
discontinuity = 0.5

[initials.left]
density = 5.99924
velocity = 19.5975
pressure = 460.894

[initials.right]
density = 5.99242
velocity = -6.19633
pressure = 46.095

[boundaries.left]
type = "transmissive"

[boundaries.right]
type = "transmissive"

[solver]
method = "finite_volume"
flux = "godunov_exact"
integrator = "explicit_euler"
cfl = 0.4

[solver.exact]
max_iterations = 100

[output]
directory = "results/toro_5"
format = "csv"
save_every = 10
fields = ["density", "momentum", "energy", "velocity", "pressure"]
