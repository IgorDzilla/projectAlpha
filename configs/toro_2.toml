# Toro 2: Two rarefactions. Начальные состояния постоянны на полуосях.
config_version = 3

[problem]
type = "euler_1d"

[parameters]
gamma = 1.4

[domain]
x = [0.0, 1.0]
t = [0.0, 0.15]

[grid]
points = 200

[initials]
type = "riemann"
discontinuity = 0.5

[initials.left]
density = 1.0
velocity = -2.0
pressure = 0.4

[initials.right]
density = 1.0
velocity = 2.0
pressure = 0.4

[solver]
method = "exact_riemann"

[solver.exact]
max_iterations = 100

[output]
directory = "results/toro_2"
format = "csv"
fields = ["density", "momentum", "energy", "velocity", "pressure"]
