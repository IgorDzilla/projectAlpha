# Toro 4: Strong right pressure. Начальные состояния постоянны на полуосях.
config_version = 2

[problem]
type = "euler_1d"

[parameters]
gamma = 1.4

[domain]
x = [0.0, 1.0]
t = [0.0, 0.035]

[grid]
cells = 200

[initials]
type = "riemann"
discontinuity = 0.5

[initials.left]
density = 1.0
velocity = 0.0
pressure = 0.01

[initials.right]
density = 1.0
velocity = 0.0
pressure = 100.0

[boundaries.left]
type = "transmissive"

[boundaries.right]
type = "transmissive"

[solver]
method = "finite_volume"
flux = "godunov_exact"
integrator = "explicit_euler"
cfl = 0.4

[solver.exact]
max_iterations = 100

[output]
directory = "results/toro_4"
format = "csv"
save_every = 10
fields = ["density", "momentum", "energy", "velocity", "pressure"]
